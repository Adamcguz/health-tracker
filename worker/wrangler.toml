name = "health-tracker-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Locks CORS to the deployed Pages origin so the API key can't be used from
# anywhere else. Update if you fork the repo under a different GitHub user.
ALLOWED_ORIGIN = "https://adamcguz.github.io"
DAILY_ANALYSIS_LIMIT = "30"

# Created by `wrangler kv namespace create RATE_LIMIT` during setup — paste
# the id it prints here.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
